<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capture Job</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 450px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #faf8f3;
            color: #1a1a1a;
        }

        .header {
            background: #c84c09;
            color: white;
            padding: 1rem;
            text-align: center;
        }

        h1 {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .content {
            padding: 1rem;
        }

        .status {
            background: #e8f4f8;
            border-left: 4px solid #0066cc;
            padding: 0.75rem;
            margin-bottom: 1rem;
            font-size: 0.95rem;
        }

        .status.success {
            background: #e8f8e8;
            border-color: #00aa00;
        }

        .status.error {
            background: #ffe8e8;
            border-color: #cc0000;
        }

        .status.info {
            background: #e8f2ff;
            border-color: #4a90e2;
        }

        label {
            display: block;
            font-weight: 600;
            margin-top: 0.75rem;
            margin-bottom: 0.25rem;
            font-size: 0.95rem;
            color: #333;
        }

        input, textarea {
            width: 100%;
            padding: 0.5rem;
            border: 2px solid #d4cfc4;
            font-size: 0.95rem;
            font-family: inherit;
            background: white;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #c84c09;
        }

        textarea {
            min-height: 60px;
            resize: vertical;
        }

        .buttons {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        button {
            flex: 1;
            padding: 0.75rem;
            border: none;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }

        .btn-save {
            background: #c84c09;
            color: white;
        }

        .btn-save:hover {
            background: #a33d07;
        }

        .btn-save:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .btn-view {
            background: #f0f0f0;
            color: #333;
        }

        .btn-view:hover {
            background: #e0e0e0;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: #7a7568;
        }

        .hint {
            font-size: 0.85rem;
            color: #7a7568;
            margin-top: 0.25rem;
        }

        /* ========== DONATE BANNERS ========== */
        /* Simple Job Capture has no paywall. These are optional, dismissible
           reminders — never a gate on functionality. */

        .donate-banner-small {
            background: #fff8e6;
            border: 1px solid #ffb300;
            border-radius: 4px;
            padding: 0.6rem 0.75rem;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            line-height: 1.4;
        }

        .donate-banner-small a {
            color: #c84c09;
            font-weight: 600;
            text-decoration: none;
        }

        .donate-banner-small a:hover { text-decoration: underline; }

        .donate-banner-close {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            color: #7a7568;
            opacity: 0.6;
            flex-shrink: 0;
            padding: 0.2rem;
            line-height: 1;
        }

        .donate-banner-close:hover { opacity: 1; }

        .donate-banner-milestone {
            background: #fff3cd;
            border: 2px solid #ffb300;
            border-radius: 6px;
            padding: 1rem;
            margin-bottom: 1rem;
            text-align: center;
        }

        .donate-banner-milestone .donate-banner-icon {
            font-size: 1.8rem;
            margin-bottom: 0.25rem;
        }

        .donate-banner-milestone strong {
            display: block;
            font-size: 1.05rem;
            margin-bottom: 0.4rem;
        }

        .donate-banner-milestone p {
            font-size: 0.9rem;
            color: #555;
            margin-bottom: 0.75rem;
            line-height: 1.5;
        }

        .donate-banner-actions {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
        }

        .donate-banner-support-btn {
            background: #c84c09;
            color: white;
            border: none;
            padding: 0.6rem 1rem;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            font-family: inherit;
        }

        .donate-banner-support-btn:hover { background: #a33d07; }

        .donate-banner-snooze-btn {
            background: white;
            color: #7a7568;
            border: 2px solid #d4cfc4;
            padding: 0.6rem 1rem;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            font-family: inherit;
        }

        .donate-banner-snooze-btn:hover { background: #f5f5f5; }

        /* Auto-fill highlight animation */
        @keyframes autofill-highlight {
            0% { background-color: #fff3cd; }
            100% { background-color: white; }
        }

        .auto-filled {
            animation: autofill-highlight 2s ease-out;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>&#128203; Capture Job Posting</h1>
    </div>
    
    <div class="content">
        <div id="loading" class="loading">
            Extracting job information...
        </div>

        <div id="form" style="display: none;">
            <div id="donateBannerContainer"></div>
            <div id="status" class="status" style="display: none;"></div>

            <label for="title">Job Title</label>
            <input type="text" id="title" placeholder="e.g., Senior Software Engineer">

            <label for="company">Company</label>
            <input type="text" id="company" placeholder="e.g., Acme Corp">

            <label for="location">Location</label>
            <input type="text" id="location" placeholder="e.g., Remote, New York, NY, or Hybrid">

            <label for="companyAddress">Company Address</label>
            <input type="text" id="companyAddress" placeholder="Full company address">

            <label for="url">URL</label>
            <input type="text" id="url" placeholder="Job posting URL">
            <div class="hint">The page you're currently viewing</div>

            <label for="requirements">Requirements</label>
            <input type="text" id="requirements" placeholder="Resume, Cover Letter, References">
            <div class="hint">Comma-separated list</div>

            <label for="salary">Salary Range</label>
            <input type="text" id="salary" placeholder="e.g., $80,000-$100,000">

            <label for="deadline">Deadline</label>
            <input type="text" id="deadline" placeholder="e.g., Jan 25, 2026 or 1/25/2026 or tomorrow">

            <label for="datePosted">Date Posted</label>
            <input type="text" id="datePosted" placeholder="e.g., January 20 or 1/20/2026">

            <label for="notes">Notes</label>
            <textarea id="notes" placeholder="Any additional notes about this position..."></textarea>

            <div class="buttons">
                <button class="btn-view" id="viewBtn">View Tracker</button>
                <button class="btn-save" id="saveBtn">Save Job</button>
            </div>

            <p style="font-size: 0.75rem; color: #7a7568; margin-top: 1rem; line-height: 1.4; text-align: center;">
                Your data stays 100% local. No ads, no tracking, no subscriptions.<br>
                <a href="https://github.com/tamarhayrikyan-tech/simple-job-capture" style="color: #c84c09;" target="_blank">Open source on GitHub</a>.
            </p>
        </div>
    </div>

    <script src="date-utils.js"></script>
    <script src="donate-banner.js"></script>
    <script src="popup.js"></script>
</body>
</html>
